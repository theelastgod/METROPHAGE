name = "metrophage-server"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Workers Paid ($5) — higher CPU budget, DO request volume, D1 ops. Keep SQLite-backed
# Durable Objects (recommended); Paid unlocks headroom for 20 Hz multiplayer zones.
# [limits] cpu_ms is a Workers PAID feature. The account dropped to the Free plan
# after 2026-07-19 (deploy rejected: "CPU limits are not supported for the Free plan",
# code 100328). Re-enable both lines below when Workers Paid is active again.
# [limits]
# cpu_ms = 30000

# Route the Worker nearer to players when possible (Paid). DO simulation still pins
# per-zone by name; this mainly helps /metro, /identity, /leaderboard, /health.
[placement]
mode = "smart"

# Authoritative per-zone simulation lives in a Durable Object.
[[durable_objects.bindings]]
name = "WORLD"
class_name = "WorldDO"

# SQLite-backed DO (not new_classes): Cloudflare's recommended default. Every storage
# API WorldDO uses — state.storage get/put, alarms, and the Hibernation WebSocket set —
# is supported on SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldDO"]

# Durable source of truth. database_id is set for the live D1 database.
[[d1_databases]]
binding = "DB"
database_name = "metrophage"
database_id = "7f030a09-a0d0-44f5-8192-cf657bd04253"
migrations_dir = "migrations"

# Runtime flags visible to the Worker (non-secret). Secrets stay in `wrangler secret`.
[vars]
# "1" only when the Cloudflare account is on Workers Paid (labels /health plan).
# Set to "0" 2026-08-18: account is on the Free plan (see [limits] note above).
METRO_PAID_TIER = "0"
# Launch ops: build stamp for /health (update on release). Kill switches default OFF.
METRO_BUILD = "0bd063e+dirty-20260818"
# Soft hub capacity (see src/game/featureFlags.ts).
METRO_HUB_CAP = "48"
# Horizontal zone shards (safe / dN / subway). Instance 0 keeps legacy DO name.
METRO_MAX_INSTANCES = "4"
# Soft concurrent target per combat/subway instance (hub uses METRO_HUB_CAP).
METRO_INSTANCE_CAP = "40"
# $METRO settlement family — Solana SPL is authoritative (pump.fun mint).
# evm.ts is unused. METRO_SETTLEMENT=robinhood resolves to credits-only off.
METRO_SETTLEMENT = "solana"
# Network target: Solana mainnet-beta. Mint CA intentionally empty until go-live.
# When CA is ready: wrangler secret put METRO_MINT (base58, never lowercased)
# + METRO_TREASURY_SECRET (base64 64-byte keypair), then METRO_MAINNET_ARMED=1
# and rebuild client with VITE_METRO_MINT. Real value cannot move on mainnet
# until METRO_MAINNET_ARMED=1.
# Genesis Keys: `npm run mint:genesis-keys`, stamp estates.nft from
# marketing/false-addresses/stamp-estates.sql. Unsold keys stay in the treasury.
METRO_CLUSTER = "mainnet-beta"
METRO_RPC = "https://api.mainnet-beta.solana.com"
# Kill switches — set to "1" during an incident, redeploy (or wrangler secret/var):
# METRO_DISABLE_MARKET = "1"
# METRO_DISABLE_CLAIM_GOAL = "1"
# METRO_DISABLE_DISTRICT_WAR = "1"

# Reliability: reclaim abandoned cash-out claims + refresh Solana $METRO oracle.
# Cloudflare's finest cron is 60s (`* * * * *`) — pump.fun is not a 30-minute L2 listing.
# Does not touch the 20 Hz DO tick path.
[triggers]
crons = ["* * * * *"]
